<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Login & Registration Form</title>
  <!--- Custom CSS File --->
  <link rel="stylesheet" href="/Frontend/src/css/style.css">
  <style>
    /* Example styles for the forms */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .form {
      display: none;
    }
    .form.active {
      display: block;
    }
    .toggle {
      cursor: pointer;
      color: blue;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login form active">
      <header>Login</header>
      <form action="#">
        <select id="userRole" required style="width: 100%; height: 50px; padding: 0 15px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px;">
          <option value="" disabled selected>Select Role</option>
          <option value="Admin">Admin</option>
          <option value="WardMember">Ward Member</option>
          <option value="Sarpanch">Sarpanch</option>
          <option value="Mukhiya">Mukhiya</option>
          <option value="NagarNigam">Nagar Nigam</option>
        </select>
        <input type="email" placeholder="Enter your email" required>
        <input type="password" placeholder="Enter your password" required>
        <a href="#">Forgot password?</a>
        <input type="button" class="button" value="Login" onclick="redirectToPage()">
      </form>
      <div class="signup">
        <span>Don't have an account? 
          <span class="toggle" onclick="toggleForms('registration')">Register</span>
        </span>
      </div>
    </div>
    <div class="registration form">
      <header>Register</header>
      <form action="#">
        <input type="text" placeholder="Enter your full name" required>
        <input type="email" placeholder="Enter your email" required>
        <input type="password" placeholder="Create a password" required>
        <input type="password" placeholder="Confirm your password" required>
        <input type="button" class="button" value="Register" onclick="redirectToPage()">
      </form>
      <div class="signup">
        <span>Already have an account? 
          <span class="toggle" onclick="toggleForms('login')">Login</span>
        </span>
      </div>
    </div>
  </div>

  <script>
    function redirectToPage() {
      const role = document.getElementById('userRole') ? document.getElementById('userRole').value : null;
      if (role === 'Mukhiya') {
        window.location.href = "/Frontend/src/mukhiya/MukhiyaDashboard.html";
      } else {
        window.location.href = "AdminDashboard.html"; 
      }
    }

    function toggleForms(formToShow) {
      const forms = document.querySelectorAll('.form');
      forms.forEach(form => form.classList.remove('active'));

      const targetForm = document.querySelector(`.${formToShow}`);
      if (targetForm) {
        targetForm.classList.add('active');
      }
    }
  </script>
</body>
</html>
