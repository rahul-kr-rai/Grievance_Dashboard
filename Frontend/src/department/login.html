<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin / Officer Login</title>
  <link rel="stylesheet" href="/Frontend/src/css/style.css">
  <script src="/Backend/db/userDB.js"></script>
  <style>
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .toggle {
      cursor: pointer;
      color: blue;
      text-decoration: underline;
    }

    .error-msg {
      color: #dc3545;
      font-size: 14px;
      margin-top: 8px;
      display: none;
    }
  </style>
    <script src="/Frontend/src/script/popup.js"></script>
    <script src="/Frontend/src/script/notifications.js" data-role="admin"></script>
</head>

<body>
  <div class="container">

    <!-- LOGIN FORM -->
    <div class="login form active">
      <header>Department Login</header>
      <form action="#" onsubmit="return false;">
        <input type="email" id="adminEmail" placeholder="Enter your email" required>
        <input type="password" id="adminPass" placeholder="Enter your password" required>
        <a href="#">Forgot password?</a>
        <p id="loginError" class="error-msg"></p>
        <input type="button" class="button" value="Login" onclick="loginAdmin()">
      </form>
      <div class="signup">
        <span>Need an account?
          <span class="toggle" onclick="toggleForms('registration')">Register</span>
        </span>
      </div>
    </div>

    <!-- REGISTER FORM -->
    <div class="registration form">
      <header>Register Staff</header>
      <form action="#" onsubmit="return false;">
        <input type="text" id="regName" placeholder="Enter your full name" required>
        <input type="email" id="regEmail" placeholder="Enter your email" required>
        <input type="password" id="regPass" placeholder="Create a password" required>
        <input type="password" id="regConfirmPass" placeholder="Confirm your password" required>
        <p id="regError" class="error-msg"></p>
        <input type="button" class="button" value="Register" onclick="registerAdmin()">
      </form>
      <div class="signup">
        <span>Already have an account?
          <span class="toggle" onclick="toggleForms('login')">Login</span>
        </span>
      </div>
    </div>

  </div>

  <script>
    async function loginAdmin() {
      var email = document.getElementById('adminEmail').value.trim();
      var pass  = document.getElementById('adminPass').value;
      var errEl = document.getElementById('loginError');

      errEl.style.display = 'none';

      if (!email || !pass) {
        errEl.textContent = 'Please enter your email and password.';
        errEl.style.display = 'block';
        return;
      }

      // null role = match by email+password only, redirect based on actual stored role
      var result = await loginUserToDB(email, pass, null);

      if (!result.success) {
        errEl.textContent = 'Invalid email or password. Please register first.';
        errEl.style.display = 'block';
        return;
      }

      if (result.user.role === 'citizen') {
        errEl.textContent = 'Citizen accounts must log in from the citizen portal.';
        errEl.style.display = 'block';
        return;
      }

      if (result.user.role === 'mukhiya') {
        window.location.href = '/Frontend/src/mukhiya/MukhiyaDashboard.html';
      } else {
        window.location.href = 'AdminDashboard.html';
      }
    }

    async function registerAdmin() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const pass = document.getElementById('regPass').value;
      const confirm = document.getElementById('regConfirmPass').value;
      const errEl = document.getElementById('regError');

      errEl.style.display = 'none';

      if (!name || !email || !pass) {
        errEl.textContent = 'Please fill all fields.';
        errEl.style.display = 'block';
        return;
      }
      if (pass !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.style.display = 'block';
        return;
      }

      const result = await registerUserToDB(name, email, pass, 'N/A', 'admin');
      if (!result.success) {
        errEl.textContent = result.message;
        errEl.style.display = 'block';
        return;
      }

      const loginResult = await loginUserToDB(email, pass, 'admin');
      if (loginResult.success) window.location.href = "AdminDashboard.html";
    }

    function toggleForms(formToShow) {
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
      const target = document.querySelector('.' + formToShow);
      if (target) target.classList.add('active');
    }
  </script>
</body>

</html>
