<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="/Frontend/src/css/index.css">
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <script src="/Frontend/src/script/popup.js"></script>
</head>
<body>
      <center><img src="/Frontend/src/image/Gov.png" alt="gov-icon"></center> 
      <br>
      <h1 class="select-user">Welcome To The Grievance Portal</h1>
      <div class="Log-image">
        <center>
        
        <br>
        <img src="/Frontend/src/image/Citizen.png" alt="citizen" class="icon"> 
        <img src="/Frontend/src/image/Department.png" alt="Department" class="icon"> 
        </center>
      </div>
      <div class="button">
       <center> 
                <button class="login-button" onclick="redirectTocitizen()">Citizen <i class="fas fa-sign-in-alt"></i></button>
                <button class="signup-button" onclick="redirectToAdmin()"><i class="fas fa-user"></i> Department Login</button> 
                <P style="font-family: Arial, Helvetica, sans-serif;"><b><i class="fa fa-info-circle" style="font-size:20px;color:red"></i>  Please select user type.</b></P> 
       </center>
      </div>
      <script>
        function redirectTocitizen() {
            window.location.href = "/Frontend/src/citizen/login.html";  
        }
        function redirectToAdmin() {
            window.location.href = "/Frontend/src/department/login.html";  
        }
      </script>
</body>
</html>
