<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Direct Connect</title>
    <link rel="stylesheet" href="/Frontend/src/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <script src="/Backend/db.js"></script>
</head>

<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <a href="/Frontend/src/html/Dashbord.html"><img src="/Frontend/src/image/logo.png" alt="Logo"></a>
            </div>
            <nav class="nav-links">
                <h1>Welcome Rahul</h1>
            </nav>
            <div class="profile-section">
                <a href="/Frontend/src/index.html" class="login-btn"><i class="fas fa-bell" style="color: #fbff00; font-size: 250%;"></i></a>
                <a href="/Frontend/src/index.html" class="login-btn"><i class="fas fa-user-circle" style="color: #ffffff; font-size: 250%;"></i></a>
            </div>
        </div>
    </header>

    <div class="main-content">
        <aside class="sidebar">
            <div class="sidebar-container">
                <h1 style="color: #00009c;"><i class="fas fa-home"></i> Dashboard</h1>
                <div class="links">
                    <a href="Raise New Complaint.html"><i class="fas fa-hand-rock"></i> Raise New Complaint</a>
                    <a href="Active Complain.html"><i class="fas fa-bolt"></i> Active Complaint</a>
                    <a href="Track complain status.html"><i class="fab fa-telegram-plane"></i> Track Complaint Status</a>
                    <a href="GovSchame.html"><i class="fas fa-gavel"></i> Government Scheme</a>
                    <a href="Direct connect.html" class="connect-link active-link"><i class="fas fa-users"></i> <b>Direct Connect</b></a>
                    <a href="/Frontend/src/index.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </aside>

        <div class="content">
            <h2>Connect with your local government</h2>
            <br><br>
            <!----------------------------------- Option to connect ---------------------------------->
            <div class="conect">
                <p2>Rural:</p2>
                <div class="button-group">
                    <button class="connect-btn"><i class="fas fa-comment"></i> Mukhiya</button>
                    <button class="connect-btn"><i class="fas fa-comment"></i> Sarpanch</button>
                    <button class="connect-btn"><i class="fas fa-comment"></i> Ward Member</button>
                    <button class="connect-btn"><i class="fas fa-comment"></i> BDO/CEO</button>
                </div>
            </div>
            <div class="conect">
                <p2>Urban:</p2>
                <div class="button-group">
                    <button class="connect-btn"><i class="fas fa-comment"></i> Nagar Nigam</button>
                    <button class="connect-btn"><i class="fas fa-comment"></i> Nagar Panchayat</button>
                </div>
            </div>
        </div>
    </div>

    <!----------------------------------- Modal ---------------------------------->
    <div class="modal-overlay" id="modal-overlay"></div>
    <div class="modal" id="connect-modal">
        <div class="modal-header">
            <h3>Connect Options</h3>
        </div>
        <div class="modal-content">
            <div id="connect-options">
                <a id="whatsapp-link" href="#" target="_blank"><i class="fab fa-whatsapp"></i> Connect on WhatsApp</a>
                <a id="phone-link" href="#"><i class="fas fa-phone"></i> Call</a>

                <!-- Chat box -->
                <div class="chat-box">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-input">
                    <input type="text" id="chat-input-field" placeholder="Type a message...">
                    <button id="chat-send-btn"><i class="fas fa-paper-plane"></i></button>
                    <!-- File attachment -->
                    <label for="chat-attachment" class="attach-btn">
                        <i class="fas fa-paperclip"></i>
                    </label>
                    <input type="file" id="chat-attachment" style="display:none" accept="image/*,video/*,.pdf,.doc,.docx,.txt">
                </div>
            </div>

        </div>
            <button class="close-btn" id="close-modal">
    <i class="fas fa-times"></i>
</button>

        </div>
    </div>

    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2025 TDP Project All Rights Reserved</p>
        </div>
    </footer>
    <script src="/Frontend/src/script/directConnect.js"></script>
</body>
</html>
