<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="/Frontend/src/css/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <script src="/Backend/db.js"></script>
    <script src="/Backend/db/auth.js" data-role="citizen"></script>
    <script src="/Frontend/src/script/popup.js"></script>
</head>

<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <a href="/Frontend/src/html/Dashbord.html"><img src="/Frontend/src/image/logo.png" alt="Logo"></a>
            </div>
            <nav class="nav-links">
                <h1>Welcome Rahul</h1>
            </nav>
            <div class="profile-section">
                <a href="/Frontend/src/index.html" class="login-btn"><i class="fas fa-bell" style="color: #fbff00; font-size: 250%;"></i></a>
                <a href="/Frontend/src/index.html" class="login-btn"><i class="fas fa-user-circle" style="color: #ffffff; font-size: 250%;"></i></a>
            </div>
        </div>
    </header>

    <div class="main-content">
        <aside class="sidebar">
            <div class="sidebar-container">
                <h1 style="color: #00009c;"><i class="fas fa-home"></i> Dashboard</h1>
                <br>
                <div class="links">
                    <a href="Raise New Complaint.html"><i class="fas fa-hand-rock"></i> Raise New Complaint</a>
                    <a id="active-complaint-link" href="Active Complain.html?view=active"><i class="fas fa-bolt"></i> <b>Active Complaint</b></a>
                    <a href="Track complain status.html"><i class="fab fa-telegram-plane"></i> Track Complaint Status</a>
                    <a href="GovSchame.html"><i class="fas fa-gavel"></i> Government Scheme</a>
                    <a href="Direct connect.html"><i class="fas fa-users"></i> Direct Connect</a>
                    <a href="/Frontend/src/index.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </aside>
        
        <div class="content">
            <div class="view-toggle" style="margin-bottom: 20px; text-align: center;">
                <a href="Active Complain.html?view=active" 
                   style="padding: 10px 15px; background-color: #119238; color: white; border-radius: 5px; text-decoration: none;">
                   <i class="fas fa-bolt"></i> Active Complaint
                </a>
                <a href="Active Complain.html?view=history" 
                   style="padding: 10px 15px; background-color: #ff3232; color: white; border-radius: 5px; text-decoration: none; margin-left: 10px;">
                   <i class="fas fa-history"></i> Complaint History
                </a>
            </div>
            <div class="complaint-Submitted" style="margin-top: 5%;">
                <p style="text-align: center; color: #555;">Loading complaint data...</p>
            </div>
            </div>
    </div>

    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2025 TDP Project All Rights Reserved</p>
        </div>
    </footer>
    <script>
        // Synchronize sidebar active link based on view parameter
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const viewMode = urlParams.get('view') || 'active'; // Default to active
            const link = document.getElementById('active-complaint-link');

            if (link) {
                // Remove existing active-link if present
                document.querySelectorAll('.links a').forEach(a => a.classList.remove('active-link'));
                
                // Add active-link class if the URL matches what we expect for Active/History
                if (window.location.pathname.endsWith('Active Complain.html')) {
                    link.classList.add('active-link');
                }
            }
        });
    </script>
    <script src="/Frontend/src/script/trackComplaint.js"></script>
    <script src="/Frontend/src/script/profile.js"></script>
</body>

</html>
