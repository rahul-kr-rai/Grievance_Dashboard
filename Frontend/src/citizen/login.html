<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Login & Registration Form</title>
  <!--- Custom CSS File --->
  <link rel="stylesheet" href="/Frontend/src/css/style.css">
  <style>
    /* Example styles for the forms */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .form {
      display: none;
    }
    .form.active {
      display: block;
    }
    .toggle {
      cursor: pointer;
      color: blue;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login form active">
      <header>Login</header>
      <form action="#" id="loginForm">
        <input type="email" id="loginEmail" placeholder="Enter your email" required>
        <input type="password" id="loginPass" placeholder="Enter your password" required>
        <a href="#">Forgot password?</a>
        <input type="button" class="button" value="Login" onclick="loginCitizen()">
      </form>
      <div class="signup">
        <span>Don't have an account? 
          <span class="toggle" onclick="toggleForms('registration')">Register</span>
        </span>
      </div>
    </div>
    <div class="registration form">
      <header>Register</header>
      <form action="#" id="registerForm">
        <input type="text" id="regName" placeholder="Enter your full name" required>
        <input type="text" id="regPhone" placeholder="Enter your phone number" required>
        <input type="email" id="regEmail" placeholder="Enter your email" required>
        <input type="password" id="regPass" placeholder="Create a password" required>
        <input type="password" id="regConfirmPass" placeholder="Confirm your password" required>
        <input type="button" class="button" value="Register" onclick="registerCitizen()">
      </form>
      <div class="signup">
        <span>Already have an account? 
          <span class="toggle" onclick="toggleForms('login')">Login</span>
        </span>
      </div>
    </div>
  </div>

  <script>
    function registerCitizen() {
      const name = document.getElementById('regName').value;
      const phone = document.getElementById('regPhone').value;
      const email = document.getElementById('regEmail').value;
      if (!name || !email) return alert('Please enter your name and email');
      
      localStorage.setItem('loggedInCitizenName', name);
      localStorage.setItem('loggedInCitizenEmail', email);
      localStorage.setItem('loggedInCitizenPhone', phone);
      localStorage.setItem('citizenName', name); // Used by chat system
      
      // Clear old user data
      localStorage.removeItem('activeComplaint');
      localStorage.removeItem('complaintHistory');
      
      window.location.href = "Dashbord.html"; 
    }

    function loginCitizen() {
      const email = document.getElementById('loginEmail').value;
      if (!email) return alert('Please enter your email');
      
      const savedEmail = localStorage.getItem('loggedInCitizenEmail');
      let resolvedName;
      if (email === savedEmail) {
          resolvedName = localStorage.getItem('loggedInCitizenName') || email.split('@')[0];
      } else {
          resolvedName = email.split('@')[0];
          localStorage.setItem('loggedInCitizenName', resolvedName);
          localStorage.setItem('loggedInCitizenEmail', email);
          localStorage.setItem('loggedInCitizenPhone', 'N/A');
      }
      
      localStorage.setItem('citizenName', resolvedName); // Used by chat system
      
      // Clear old user data to prevent cross-user leakage
      localStorage.removeItem('activeComplaint');
      localStorage.removeItem('complaintHistory');
      
      window.location.href = "Dashbord.html"; 
    }

    function toggleForms(formToShow) {
      const forms = document.querySelectorAll('.form');
      forms.forEach(form => form.classList.remove('active'));

      const targetForm = document.querySelector(`.${formToShow}`);
      if (targetForm) {
        targetForm.classList.add('active');
      }
    }
  </script>
</body>
</html>
