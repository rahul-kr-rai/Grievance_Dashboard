<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mukhiya Login</title>
  <link rel="stylesheet" href="/Frontend/src/css/style.css">
  <script src="/Backend/db/userDB.js"></script>
  <style>
    .container { display: flex; flex-direction: column; align-items: center; }
    .error-msg { color: #dc3545; font-size: 14px; margin-top: 8px; display: none; }
  </style>
    <script src="/Frontend/src/script/popup.js"></script>
</head>
<body>
  <div class="container">
    <div class="login form active" style="display:block;">
      <header>Mukhiya Login</header>
      <form action="#" onsubmit="return false;">
        <input type="email" id="mukhiyaEmail" placeholder="Enter your email" required>
        <input type="password" id="mukhiyaPass" placeholder="Enter your password" required>
        <a href="#">Forgot password?</a>
        <p id="mukhiyaError" class="error-msg"></p>
        <input type="button" class="button" value="Login" onclick="loginMukhiya()">
      </form>
    </div>
  </div>

  <script>
    function loginMukhiya() {
      const email = document.getElementById('mukhiyaEmail').value.trim();
      const pass  = document.getElementById('mukhiyaPass').value;
      const errEl = document.getElementById('mukhiyaError');

      errEl.style.display = 'none';

      if (!email || !pass) {
        errEl.textContent = 'Please enter your email and password.';
        errEl.style.display = 'block';
        return;
      }

      const result = loginUserToDB(email, pass, 'mukhiya');
      if (!result.success) {
        errEl.textContent = 'Invalid credentials. Access denied.';
        errEl.style.display = 'block';
        return;
      }

      window.location.href = "MukhiyaDashboard.html";
    }
  </script>
</body>
</html>
